[tox]
isolated_build = true
envlist = {py310}

[testenv]
# `coverage` is the only development dependency the tests need, so it is installed here. Running `poetry install` in
# this environment instead would break the run: tox has already installed `poetry` itself (a runtime dependency of this
# package) at its newest version, and `poetry install` then downgrades `poetry-core` to the locked version underneath
# the `poetry` process running it, which can no longer build this package's metadata.
deps =
    coverage>=6.5.0,<7.0.0
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/generate_pull_request_description
commands =
    coverage run --source check_semantic_version -m unittest
    coverage report --show-missing
    coverage xml
